name: Java build and graphics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - name: Linux graphical smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          bash scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skyblock-${{ runner.os }}
          path: |
            target/skyblock-classic-0.1.0.jar
            target/smoke-*.png
            target/menu-*.png
            target/surefire-reports/*.xml
